# Пайплайн запускается только при push в ветку FIO_30 (и при MR в неё при необходимости).
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "FIO_30"

stages:
  - loadtest

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

loadtest:
  stage: loadtest
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    # Headless: без веб-UI, фиксированные пользователи, длительность, отчёты в файлы
    - |
      locust -f locustfile.py --headless \
        -u 5 -r 1 -t 30s \
        --html locust-report.html \
        --csv locust-stats
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - locust-report.html
      - locust-stats_stats.csv
      - locust-stats_failures.csv
      - locust-stats_exceptions.csv
      - locust-stats_stats_history.csv
